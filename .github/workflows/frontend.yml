name: Frontend Next.js CI/CD

on:
  push:
    branches: [ "master" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Linter
        id: lint
        working-directory: frontend
        run: npm run lint

      - name: Run Type Checking
        id: typecheck
        working-directory: frontend
        run: |
          if npm run | grep -q "typecheck"; then
            echo "Running npm run typecheck..."
            npm run typecheck
          else
            echo "typecheck script not found in package.json, falling back to npx tsc --noEmit..."
            npx tsc --noEmit
          fi

      - name: Next.js Production Build
        id: build
        working-directory: frontend
        run: npm run build

      - name: Generate Workflow Summary
        if: always()
        run: |
          echo "### Frontend CI Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Verification Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint (\`npm run lint\`) | ${{ steps.lint.outcome == 'success' && '✅ Passed' || (steps.lint.outcome == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check (\`typecheck/tsc\`) | ${{ steps.typecheck.outcome == 'success' && '✅ Passed' || (steps.typecheck.outcome == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Next.js Production Build | ${{ steps.build.outcome == 'success' && '✅ Passed' || (steps.build.outcome == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
